# herdr configuration
# Managed by dotfiles. Key bindings intentionally mirror tmux where possible.

onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
accent = "#cba6f7"
panel_bg = "#1e1e2e"
surface0 = "#313244"
surface1 = "#45475a"
surface_dim = "#313244"
overlay0 = "#b4befe"
overlay1 = "#cdd6f4"
text = "#cdd6f4"
subtext0 = "#a6adc8"
mauve = "#cba6f7"
green = "#a6e3a1"
yellow = "#f9e2af"
red = "#f38ba8"
blue = "#89b4fa"
teal = "#94e2d5"
peach = "#fab387"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+a"

# Help, settings, and session lifecycle.
help = "prefix+?"
settings = "prefix+comma"
detach = "prefix+d"
reload_config = "prefix+r"
open_notification_target = "prefix+o"

# Workspace and worktree navigation.
workspace_picker = "prefix+s"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+h"
next_workspace = "prefix+l"
switch_workspace = "prefix+shift+1..9"

# Agent focus follows Herdr's indexed row model.
previous_agent = "prefix+k"
next_agent = "prefix+j"
focus_agent = "prefix+alt+1..9"

# Tab bindings mirror tmux windows.
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+q"

# Pane bindings mirror tmux panes.
rename_pane = "prefix+shift+comma"
edit_scrollback = "prefix+e"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+backslash"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+q"
zoom = "prefix+z"
resize_mode = ["prefix+shift+h", "prefix+shift+j", "prefix+shift+k", "prefix+shift+l"]
toggle_sidebar = "prefix+b"

# Navigate-mode movement keeps Vim-style home-row navigation.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = "down"
navigate_pane_up = "up"
navigate_pane_right = "l"
remote_image_paste = "ctrl+v"

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "pane_id=$(herdr pane current | jq -r '.result.pane.pane_id') && herdr pane send-keys \"$pane_id\" ctrl+l"

[ui]
accent = "#fab387"
mouse_capture = true
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
sidebar_collapsed_mode = "hidden"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = false

[experimental]
allow_nested = false
kitty_graphics = false
pane_history = true
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "opencode", "kimi", "qodercli"]
cjk_ime_cursor_shape = "steady_block"

[advanced]
scrollback_limit_bytes = 25000000
